<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Broth — Night Kitchen Service</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%232d1e17' stroke='%23e6b85c' stroke-width='2'/><circle cx='16' cy='17' r='9' fill='%23df8a30'/><circle cx='19' cy='15' r='3' fill='%23ffb71b'/></svg>">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #171210;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: pointer;
    outline: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Ember and Broth: cook, assemble, and serve dishes with WASD or mouse"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
